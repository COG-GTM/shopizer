
authToken.header=Authorization

#JWT authentication configuration for sm-shop (HS512, jjwt 0.12)
#jwt.secret must be at least 64 bytes; always override it with the JWT_SECRET environment variable outside local development
jwt.header=Authorization
jwt.secret=${JWT_SECRET:shopizer-local-development-jwt-signing-key-change-me-with-the-JWT_SECRET-env-var}
#token lifetime in seconds (7 days)
jwt.expiration=${JWT_EXPIRATION:604800}


