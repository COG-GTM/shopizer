
authToken.header=Authorization

#JWT authentication configuration for sm-shop
jwt.header=Authorization
#Base64 encoded HS512 signing key (at least 64 bytes), must be supplied per deployment
#through the JWT_SECRET environment variable, e.g. JWT_SECRET=$(openssl rand -base64 64 | tr -d '\n')
jwt.secret=${JWT_SECRET}
jwt.expiration= 604800


#Your facebook app informations
facebook.app.id=
facebook.app.secret=
facebook.app.access_token=








