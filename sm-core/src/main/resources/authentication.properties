
authToken.header=Authorization

#JWT authentication configuration for sm-shop
jwt.header=Authorization
# Required. No default: supply JWT_SECRET (environment variable or -DJWT_SECRET) with at least
# 64 random bytes per deployment, e.g. `openssl rand -base64 64`. sm-shop refuses to start without it.
jwt.secret=${JWT_SECRET:}
jwt.expiration= 604800


#Your facebook app informations
facebook.app.id=
facebook.app.secret=
facebook.app.access_token=








