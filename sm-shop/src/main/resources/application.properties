#Spring boot configurations
#logging.config=log4j-shopizer.properties
server.port=8080

# Opt in to Boot virtual threads for Tomcat and auto-configured async executors (Java 21).
spring.threads.virtual.enabled=${SHOPIZER_VIRTUAL_THREADS:false}


#Turn Statistics on
#spring.jpa.properties.hibernate.generate_statistics=true
#default database schema
spring.jpa.properties.hibernate.default_schema=SALESMANAGER
#logging.level.org.hibernate.stat=debug

# Enable logging to verify that HikariCP is used, the second entry is specific to HikariCP
logging.level.org.hibernate.SQL=ERROR
logging.level.com.zaxxer.hikari.HikariConfig=INFO
#TRACE will print binding
logging.level.org.hibernate.orm.jdbc.bind=INFO

#when running from IDE (eclipse) or from springboot:run command
#server.contextPath=/shopizer

logging.level.org.springframework=ERROR
logging.level.com.shopizer=INFO
logging.level.org.hibernate=ERROR
logging.level.org.apache.http=ERROR

#logging.file=shopizer.log

#Default Spring white label error page
server.error.whitelabel.enabled=false

spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=10MB




#Spring boot 2.X
spring.main.allow-bean-definition-overriding: true

#Spring boot 2.6+ defaults to PathPatternParser; keep the Boot 2.5 AntPathMatcher semantics for the REST contract
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

#Spring boot 2.6+ prohibits circular references by default; existing cycles are listed in AB-534 for later cleanup
spring.main.allow-circular-references=true

#build informations
application-description=@project.description@
application-version=@project.version@
build.timestamp=@maven.build.timestamp@

#actuator
management.endpoints.web.exposure.include=*

management.endpoint.health.show-details=always
management.endpoint.health.show-components=always

management.health.elasticsearch.enabled=false
management.health.mail.enabled=false
management.health.ping.enabled=true








#OpenAPI 3 documentation (springdoc): /v3/api-docs and /swagger-ui.html
springdoc.packages-to-scan=com.salesmanager.shop.store.api.v1,com.salesmanager.shop.store.api.v2
springdoc.swagger-ui.persist-authorization=true
