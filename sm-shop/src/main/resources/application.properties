#Spring boot configurations
#logging.config=log4j-shopizer.properties
server.port=8080


#Turn Statistics on
#spring.jpa.properties.hibernate.generate_statistics=true
#default database schema
spring.jpa.properties.hibernate.default_schema=SALESMANAGER
#logging.level.org.hibernate.stat=debug

# Enable logging to verify that HikariCP is used, the second entry is specific to HikariCP
logging.level.org.hibernate.SQL=ERROR
logging.level.com.zaxxer.hikari.HikariConfig=INFO
#TRACE will print binding
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO

#when running from IDE (eclipse) or from springboot:run command
#server.contextPath=/shopizer

logging.level.org.springframework=ERROR
logging.level.com.shopizer=INFO
logging.level.org.hibernate=ERROR
logging.level.org.apache.http=ERROR

#logging.file=shopizer.log

#Default Spring white label error page
server.error.whitelabel.enabled=false
#never leak stack traces / exception details in error responses
server.error.include-stacktrace=never
server.error.include-exception=false

#session cookie (only used by the legacy /shop and /services realms; the JWT apis are stateless)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=10MB


#hibernate 5
spring.jpa.hibernate.use-new-id-generator-mappings=true


#Spring boot 2.X
spring.main.allow-bean-definition-overriding: true
spring.main.allow-circular-references: true

#build informations
application-description=@project.description@
application-version=@project.version@
build.timestamp=@maven.build.timestamp@

#actuator - endpoints are not behind any security filter chain, so only expose health and info
management.endpoints.web.exposure.include=health,info

management.endpoint.health.show-details=never
management.endpoint.health.show-components=always

management.health.elasticsearch.enabled=false
management.health.mail.enabled=false
management.health.ping.enabled=true

#security
#bcrypt work factor for new password hashes (existing hashes keep working)
shopizer.security.password.bcrypt-strength=10
#CORS for /api/** and /services/** (comma separated); restrict origins in production, e.g. https://shop.example.com
shopizer.cors.allowed-origin-patterns=${SHOPIZER_CORS_ALLOWED_ORIGINS:*}
shopizer.cors.allow-credentials=true
shopizer.cors.max-age=1h
