PageableProductAvailabilityRepository.listByStore(Long,Integer,String,Pageable).count=select  count(p) from ProductAvailability p join p.merchantStore pm join p.prices pp join pp.descriptions ppd join p.merchantStore pm join p.product ppr join ppr.merchantStore pprm where ppr.id=?1 and pprm.id=?2 and (?3 is null or pm.code like %?3%)
