# Java Maven CircleCI 2.0 configuration file
#
# Check https://circleci.com/docs/2.0/language-java/ for more details
#

version: 2.1

orbs:
  slack: circleci/slack@3.4.2

executors:
  shopizer-ci:
    docker:
      - image: cimg/openjdk:21.0


# Define the jobs we want to run for this project
jobs:
  build:
    executor: shopizer-ci
    steps:
      - checkout
      - run: echo "shopizer build and test (1)"
      - restore_cache:
          keys:
            - m2-{{ checksum "pom.xml" }}
            - m2-
      - run:
          name: Build and test
          command: ./mvnw -B clean install
      - run:
          name: SpotBugs report
          command: ./mvnw -B spotbugs:spotbugs
      - run:
          name: Collect test and SpotBugs reports
          command: |
            mkdir -p ~/reports/junit ~/reports/spotbugs
            find . -path '*/target/surefire-reports/*.xml' -exec cp {} ~/reports/junit/ \;
            for m in sm-core-model sm-core sm-core-modules sm-shop-model sm-shop; do
              if [ -f $m/target/spotbugsXml.xml ]; then cp $m/target/spotbugsXml.xml ~/reports/spotbugs/$m.xml; fi
            done
          when: always
      - store_test_results:
          path: ~/reports/junit
      - store_artifacts:
          path: ~/reports/spotbugs
      - save_cache:
          key: m2-{{ checksum "pom.xml" }}
          paths:
            - ~/.m2
      - persist_to_workspace:
          root: .
          paths:
            - ./sm-shop
  deploy:
    machine: true
    steps:
       - attach_workspace:
          at: .
       # start proprietary DB using private Docker image
       # with credentials stored in the UI
       - run:
           name: list files in repo
           command: ls -al
           working_directory: .
       - run:
           name: list files in shop
           command: ls -al
           working_directory: ./sm-shop
       - run:
           name: list files in shop/target
           command: ls -al
           working_directory: ./sm-shop/target
       - run: |
           docker login -u shopizerecomm -p $DOCKERHUB_PASSWORD
       - run: |
           (cd sm-shop && docker build . -t shopizerecomm/shopizer:3.2.7)
       - run:
           name: push image
           command: docker push shopizerecomm/shopizer:3.2.7

# Orchestrate our job run sequence
workflows:
  build_and_deploy:
    jobs:
      - build
      - deploy:
          requires:
            - build
