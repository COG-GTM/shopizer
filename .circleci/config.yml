# Java Maven CircleCI 2.0 configuration file
#
# Check https://circleci.com/docs/2.0/language-java/ for more details
#

version: 2.1

orbs:
  slack: circleci/slack@3.4.2

executors:
  shopizer-ci:
    docker:
      - image: cimg/openjdk:21.0
    working_directory: ~/shopizer


# Define the jobs we want to run for this project
jobs:
  build:
    executor: shopizer-ci
    steps:
      - checkout
      - restore_cache:
          keys:
            - shopizer-m2-{{ checksum "pom.xml" }}-{{ checksum "sm-core/pom.xml" }}-{{ checksum "sm-shop/pom.xml" }}
            - shopizer-m2-
      - run: echo "shopizer build and test (Java 21)"
      - run:
          name: Build and test
          command: |
            set -x
            java -version
            ./mvnw -B clean install
      - save_cache:
          paths:
            - ~/.m2
          key: shopizer-m2-{{ checksum "pom.xml" }}-{{ checksum "sm-core/pom.xml" }}-{{ checksum "sm-shop/pom.xml" }}
      - store_test_results:
          path: sm-shop/target/surefire-reports
      - persist_to_workspace:
          root: .
          paths:
            - ./sm-shop
  deploy:
    machine: true
    steps:
       - attach_workspace:
          at: .
       - run:
           name: list files in shop/target
           command: ls -al
           working_directory: ./sm-shop/target
       - run: |
           echo "$DOCKERHUB_PASSWORD" | docker login -u shopizerecomm --password-stdin
       - run: |
           (cd sm-shop && docker build . -t shopizerecomm/shopizer:3.2.7)
       - run:
           name: push image
           command: docker push shopizerecomm/shopizer:3.2.7

# Orchestrate our job run sequence
workflows:
  build_and_deploy:
    jobs:
      - build
      - deploy:
          requires:
            - build
