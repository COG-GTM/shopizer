name: Maven build

on:
  pull_request:
  push:
    branches: [epic/ab-531-v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JAVA_VERSION: '21'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Verify
        run: ./mvnw -B verify
      - name: Build Docker image
        run: docker build -t shopizer:ci sm-shop
      - name: Container smoke test
        run: |
          docker run -d --name shopizer -p 8080:8080 shopizer:ci
          for _ in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' shopizer)
            [ "$status" = healthy ] && break
            [ "$(docker inspect --format '{{.State.Running}}' shopizer)" = true ] || break
            sleep 5
          done
          user=$(docker inspect --format '{{.Config.User}}' shopizer)
          status=$(docker inspect --format '{{.State.Health.Status}}' shopizer)
          echo "user=$user health=$status"
          [ "$status" = healthy ] || { echo "container is not healthy" >&2; exit 1; }
          case "$user" in ''|0|0:*|root|root:*) echo "container runs as root" >&2; exit 1 ;; esac
          curl -fsS http://localhost:8080/actuator/health | tee health.json
          python3 -c 'import json; s = json.load(open("health.json"))["status"]; assert s == "UP", s'
      - name: Container logs
        if: always()
        run: docker logs shopizer || true
      - name: Test summary
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = sorted({
              p for kind in ("surefire", "failsafe")
              for p in Path(".").glob(f"**/target/{kind}-reports/TEST-*.xml")
          })
          totals = dict.fromkeys(("tests", "skipped", "failures", "errors"), 0)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"## Tests — JDK {os.environ['JAVA_VERSION']}\n\n")
              summary.write("| Report | Tests run | Skipped | Failures | Errors |\n")
              summary.write("| --- | ---: | ---: | ---: | ---: |\n")
              for path in reports:
                  suite = ET.parse(path).getroot()
                  counts = {key: int(suite.get(key, "0")) for key in totals}
                  for key, value in counts.items():
                      totals[key] += value
                  summary.write(f"| {path} | " + " | ".join(str(v) for v in counts.values()) + " |\n")
              summary.write("| **Total** | " + " | ".join(str(v) for v in totals.values()) + " |\n")
              if not reports:
                  summary.write("\nNo test reports were produced. See the build log.\n")
          PY
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-jdk-${{ env.JAVA_VERSION }}
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
