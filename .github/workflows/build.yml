name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Verify
        run: ./mvnw -B -ntp verify
      - name: Add test report summary
        if: always()
        env:
          JAVA_VERSION: ${{ matrix.java }}
        run: |
          python3 - <<'PY'
          import os
          from collections import defaultdict
          from pathlib import Path
          import xml.etree.ElementTree as ET

          fields = ("tests", "failures", "errors", "skipped")
          totals = dict.fromkeys(fields, 0)
          modules = defaultdict(lambda: dict.fromkeys(fields, 0))
          failed_cases = []
          reports = sorted(Path(".").glob("**/target/surefire-reports/TEST-*.xml"))
          reports += sorted(Path(".").glob("**/target/failsafe-reports/TEST-*.xml"))

          for report in reports:
              module = report.parts[-4]
              root = ET.parse(report).getroot()
              suites = [root] if root.tag == "testsuite" else root.findall("testsuite")
              for suite in suites:
                  for field in fields:
                      value = int(suite.get(field, "0"))
                      modules[module][field] += value
                      totals[field] += value
                  for case in suite.findall("testcase"):
                      for issue in (*case.findall("failure"), *case.findall("error")):
                          detail = (issue.get("message") or "".join(issue.itertext())).strip()
                          detail = detail.splitlines()[0] if detail else issue.tag
                          failed_cases.append(
                              f"- `{module}`: `{case.get('classname', '')}#{case.get('name', '')}` — {detail}"
                          )

          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write(f"## Test results (JDK {os.environ['JAVA_VERSION']})\n\n")
              if reports:
                  summary.write("| Module | Tests | Failures | Errors | Skipped |\n")
                  summary.write("| --- | ---: | ---: | ---: | ---: |\n")
                  for module in sorted(modules):
                      values = modules[module]
                      summary.write(
                          f"| {module} | {values['tests']} | {values['failures']} | "
                          f"{values['errors']} | {values['skipped']} |\n"
                      )
                  summary.write(
                      f"| **Total** | **{totals['tests']}** | **{totals['failures']}** | "
                      f"**{totals['errors']}** | **{totals['skipped']}** |\n\n"
                  )
              else:
                  summary.write("No Surefire or Failsafe XML reports were found.\n\n")
              summary.write("### Failed test cases\n\n")
              summary.write("\n".join(failed_cases) if failed_cases else "None.\n")
              summary.write("\n")
          PY
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-jdk${{ matrix.java }}
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          if-no-files-found: ignore
