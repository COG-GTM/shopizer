name: Maven build

on:
  pull_request:
  push:
    branches: [epic/ab-531-v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Verify
        run: ./mvnw -B verify
      - name: Test summary
        if: always()
        env:
          JAVA_VERSION: ${{ matrix.java }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = sorted({
              p for kind in ("surefire", "failsafe")
              for p in Path(".").glob(f"**/target/{kind}-reports/TEST-*.xml")
          })
          totals = dict.fromkeys(("tests", "skipped", "failures", "errors"), 0)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"## Tests — JDK {os.environ['JAVA_VERSION']}\n\n")
              summary.write("| Report | Tests run | Skipped | Failures | Errors |\n")
              summary.write("| --- | ---: | ---: | ---: | ---: |\n")
              for path in reports:
                  suite = ET.parse(path).getroot()
                  counts = {key: int(suite.get(key, "0")) for key in totals}
                  for key, value in counts.items():
                      totals[key] += value
                  summary.write(f"| {path} | " + " | ".join(str(v) for v in counts.values()) + " |\n")
              summary.write("| **Total** | " + " | ".join(str(v) for v in totals.values()) + " |\n")
              if not reports:
                  summary.write("\nNo test reports were produced. See the build log.\n")
          PY
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-jdk-${{ matrix.java }}
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
